[package]
name = "nuquick"
version.workspace = true
edition.workspace = true
license.workspace = true

# NuQuick: Space-bar preview for Explorer and the desktop (what Quick Look is on a Mac). One small program that sits in the
# background (no window, ~1 MB), listens for Space only while Explorer is in front, and shows the picture in a borderless
# window without taking the focus from Explorer, so the arrow keys keep moving the selection and the preview follows.
[[bin]]
name = "nuquick"
path = "src/main.rs"

[dependencies]
nv-core = { path = "../crates/nv-core" }
nv-codecs = { path = "../crates/nv-codecs" }
nv-win = { path = "../crates/nv-win" }

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]
