[package]
name = "nuimporter"
version.workspace = true
edition.workspace = true

# NuImporter: bring pictures from a card, a camera or a folder into the library. For now a MOCK-UP: the whole window works
# (sources, scan, where the files would go) and nothing is copied. It is started from NuGallery's Tools menu.
[[bin]]
name = "nuimporter"
path = "src/main.rs"

[dependencies]
nv-core = { path = "../crates/nv-core" }
nv-codecs = { path = "../crates/nv-codecs" }
nv-win = { path = "../crates/nv-win" }
