# Example plug-in: a picture format. Needs ImageMagick (magick.exe on the PATH). It lets NuViewer show formats ImageMagick reads
# and NuViewer does not. Formats NuViewer reads itself are ignored automatically, so the list can be generous.
# Copy this folder into %APPDATA%\NuViewer\plugins\ and choose Plug-ins > Reload plug-ins.
name = ImageMagick formats
version = 1.0
author = NuViewer
description = Extra picture formats through ImageMagick.
api = 1

decoder.extensions = fits, fts, miff, sgi, bw, rgb, rgba, pgx, xbm, xpm, pct, pict, sun, ras
decoder.exe = decode.cmd
decoder.args = "{input}" "{output}"
decoder.timeout = 30
