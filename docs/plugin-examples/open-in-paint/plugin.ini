# Example plug-in: a menu command. Copy this folder into %APPDATA%\NuViewer\plugins\ and choose Plug-ins > Reload plug-ins.
name = Open in Paint
version = 1.0
author = NuViewer
description = Opens the picture in Windows Paint.
api = 1

command.0.name = Open in Paint
command.0.exe = open.cmd
command.0.args = "{file}"
command.0.for = pictures
command.0.multi = false
command.0.window = hidden
