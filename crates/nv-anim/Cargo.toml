[package]
name = "nv-anim"
version.workspace = true
edition.workspace = true
license.workspace = true

# Skeletal 2D animation (Spine 3.8 - 4.2): the file readers, the pose, and a CPU rasteriser. No window, no GPU, no image decoding:
# the caller hands in the decoded atlas pages. Written from the published file-format documentation, not from Esoteric's runtime code.
[dependencies]
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_System_LibraryLoader"]
