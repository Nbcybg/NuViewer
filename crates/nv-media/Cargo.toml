[package]
name = "nv-media"
version.workspace = true
edition.workspace = true
license.workspace = true

# Video and audio playback through Windows' Media Foundation (video, sound) and winmm (waveOut). Both are loaded by hand the
# first time a media file is opened (`load.rs`), so a program that links this crate pays nothing at start-up.

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Variant",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D10",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
]
