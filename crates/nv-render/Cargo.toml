[package]
name = "nv-render"
version.workspace = true
edition.workspace = true

[dependencies]
nv-codecs = { path = "../nv-codecs" }

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
]

[build-dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc"]
