[package]
name = "nunote"
version.workspace = true
edition.workspace = true
license.workspace = true

# NuNote: the built-in notepad. Opens text, Markdown, JSON, HTML, JavaScript and every other plain-text file, edits it, and shows it
# as coloured source (syntax) or as rendered Markdown. A Win32 window with a RichEdit control: no extra runtime, starts at once.
[[bin]]
name = "nunote"
path = "src/main.rs"

[dependencies]
nv-core = { path = "../crates/nv-core" }
nv-win = { path = "../crates/nv-win" }

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Controls_RichEdit",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
