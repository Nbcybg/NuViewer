[workspace]
resolver = "2"
members = ["crates/nv-text", "crates/nv-core", "crates/nv-codecs", "crates/nv-render", "crates/nv-win", "crates/nv-editor", "crates/nv-media", "crates/nv-anim", "tools/mock-cubism", "nuviewer", "nugallery", "nueditor", "nuimporter", "nuquick", "nunote", "setup"]

[workspace.package]
version = "0.7.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/Nbcybg/NuViewer"

[workspace.dependencies]
windows = "0.62"
zune-jpeg = "0.4"
png = "0.18"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
